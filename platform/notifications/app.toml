# The notifications module, as it declares itself (ADR 0022). It has no
# engine part: its window part tells the Person of what calls, and its
# widget, the bell, shows the last toasts again (ADR 0048, ADR 0056).
id = "notifications"
kind = "platform"
name = "Notifications"
about = "Tells you of what calls, by toasts and the desktop's notifications; the bell on the bar shows the last toasts again."
version = "0.1.0"
# The major of the App API it is written to (ADR 0062, ADR 0082).
api = 1
from-banda = true
settings = []

# What it needs of Banda (ADR 0082, decision 2): nothing it could
# declare here is built yet.
[needs]
