# The sharing module, as it declares itself (ADR 0022). Its methods its
# code declares; this holds the rest. Its engine part posts what it keeps,
# from the host (ADR 0062, decision 3).
id = "sharing"
kind = "platform"
name = "Sharing"
about = "The one part of Banda that sends anything anywhere (ADR 0039, decision 4): problem reports and usage counts, each only while the Person turned it on, and each kept here first, as it goes."
version = "0.1.0"
# The major of the App API it is written to (ADR 0062, ADR 0082).
api = 1
from-banda = true
# The settings files it owns, in ~/.config/banda.
settings = ["sharing.toml"]

# What it needs of Banda (ADR 0082, decision 2): nothing it could
# declare here is built yet.
[needs]
