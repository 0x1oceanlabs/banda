# The workspaces module, as it declares itself (ADR 0022). Its methods its
# code declares; the window draws its workspaces itself (ADR 0025), and
# the Tiling there declares its actions, which client/web's tests copy into
# window.json beside this file (ADR 0087, decision 13).
id = "workspaces"
kind = "platform"
name = "Workspaces"
about = "How this machine's Panes are arranged: workspaces one under another, each a Strip of columns."
version = "0.1.0"
# The major of the App API it is written to (ADR 0062, ADR 0082).
api = 1
from-banda = true
# The settings files it owns, in ~/.config/banda: the Tiling's (ADR 0127,
# decision 4).
settings = ["tiling.toml"]

# What it needs of Banda (ADR 0082, decision 2): nothing it could
# declare here is built yet.
[needs]
