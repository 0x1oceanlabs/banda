[package]
name = "banda-machines"
description = "The machines module: what this machine is called and drawn by, from its machine.toml over what Banda finds, in the engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
banda-kernel = { path = "../../../kernel" }
banda-look = { path = "../../../platform/look" }
dunce.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tracing.workspace = true
ts-rs.workspace = true

# A battery is asked of Windows through its WinRT API, which needs no
# unsafe code.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Devices_Power", "System_Power"] }

# logind's locks and UPower, on the system bus, read so a lock comes
# close-on-exec (src/awake/linux.rs).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["net"] }
zbus.workspace = true

# The power assertion (src/awake/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-io-kit.workspace = true

[dev-dependencies]
axum.workspace = true
# The settings' `set`, which writes machine.toml in the tests as the
# window does.
banda-keys = { path = "../../keys/engine" }
futures.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true

# Not the workspace's lints: macOS's power assertion is made by a call Rust
# cannot make safe, in one function that allows it
# (`src/awake/macos.rs`, `Assertion::take`). Everywhere else `unsafe`
# stays forbidden.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
