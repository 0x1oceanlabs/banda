#:schema ./schemas/sidebar.schema.json
# How Banda's sidebar arranges your Threads. Every key is optional: what
# you leave out comes from the preset, and what the preset leaves out from
# Banda's defaults, written below. Check a change with: banda settings check
#
# The presets: "inbox" (what needs you first), "projects" (Threads under
# their Projects), "places" (Projects above, Threads by need), or one of your
# own: ~/.config/banda/sidebars/<name>.toml, with the keys of this file.
preset = "inbox"

# [group]
# by = "state"                       # "state", "project" or "none"
# states = ["active"]                # the sections, in this order
# bottom = ["working", "later", "archived"]    # shelves at the bottom, with their counts
# folded = ["later", "archived"]     # sections, shelves or Projects folded at first
# limit = 10                         # rows before "Show more"; 0 shows all
# empty = "hide"                     # an empty section: "hide" or "show"

# [sort]
# by = "attention"                   # "attention", "changed" or "title"

# [projects]
# list = false                       # a list of Projects above the Threads
# order = "changed"                  # "changed" or "name"
# rollup = true                      # a Project shows its loudest mark and count
# new-thread = true                  # each Project offers a new Thread in it

# [later]
# presets = ["1h", "3h", "18:00", "tomorrow 9:00", "mon 9:00"]  # the picker's, up to eight

# A card's lines follow where it stands: three in Your turn, two there
# when grouped by Project, one for the rest (ADR 0098, decision 9). [row]
# and its keys are no longer read; a key of the card's own comes later.

# [bar]                              # who waits for you and who works, in the bar's middle
# show = "closed"                    # "closed" (while the sidebar is), "always" or "never"
# counts = ["asking", "done", "working"]  # in this order: "asking" (asks or failed), "done", "waiting" (both), "working"
# color = true                       # a question in orange, a failure in red, done in green
# words = false                      # words beside the numbers
# empty = "mark"                     # nothing to count: the calm square ("mark"), or nothing ("hide")

# [machines]                         # once hosts.toml has another machine
# rows = "named"                     # another machine on its rows: "named" (its icon and name), "icon" or "off"
# this-too = false                   # name this machine too, as the others are
