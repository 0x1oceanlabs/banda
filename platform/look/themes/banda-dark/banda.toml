# Banda Dark (ADR 0075, decision 4): only what differs from the tokens
# its palette gives. The accent marks the focus, the selection and links;
# the main buttons take the text's colour, as shadcn's do, so
# `[colors] accent = "…"` in look.toml recolours the focus and the rings,
# not the buttons.
[tokens]
desk-solid = "darker_background"
card = "#1f1f23"
primary = "foreground"
secondary = "#27272a"
muted = "#27272a"
accent = "#27272a"
destructive = "oklch(0.704 0.191 22.216)"
attention = "#ff8a3d"
added = "oklch(0.723 0.192 149.579)"
removed = "oklch(0.704 0.191 22.216)"
border = "oklch(1 0 0 / 8%)"
input = "oklch(1 0 0 / 12%)"
sidebar-accent = "#2a2a2e"
sidebar-border = "border"
