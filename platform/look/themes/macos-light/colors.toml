# macOS Light: the Mac's own colours (ADR 0075): its window, label and
# separator colours, and Apple's system colours for the terminal. The
# accent is the one set in System Settings, which the window gives the
# page; Apple's blue elsewhere. Copied as a theme of your own, name a hex
# accent instead, as Omarchy reads only hex.
mode = "light"

accent = "var(--system-accent)"
selection = "#b3d7ff"
muted = "#a1a1a6"

background = "#ffffff"
dark_background = "#f5f5f7"
darker_background = "#ececec"
lighter_background = "#ffffff"

foreground = "#262626"
dark_foreground = "#808080"
light_foreground = "#3c3c3c"
bright_foreground = "#000000"

red = "#d70015"
yellow = "#b25000"
orange = "#c93400"
green = "#248a3d"
cyan = "#0071a4"
blue = "#007aff"
magenta = "#8944ab"
brown = "#7f6545"

bright_red = "#ff3b30"
bright_yellow = "#ff9500"
bright_green = "#34c759"
bright_cyan = "#32ade6"
bright_blue = "#409cff"
bright_magenta = "#af52de"
