#:schema ./schemas/look.schema.json
# How Banda looks. Every key is optional: what you leave out comes from
# the theme, from Hyprland's own settings when Banda runs under it, and
# from Banda's defaults, written below. Check a change with:
# banda settings check
#
# theme: "platform", the default, is this device's own: "omarchy" where
# Omarchy is installed (its current theme), "macos" on a Mac, else
# "banda", Banda's own, light and dark. Any other name is a theme folder
# in ~/.config/banda/themes/<name>/ or Omarchy's ~/.config/omarchy/themes/.
# For the system's light and dark, a pair:
# theme = { light = "tokyo-night-light", dark = "forest-dusk" }

# mode = "system"                    # "system", "light" or "dark"
# hyprland = false                   # true takes Hyprland's rounding, border and gaps; theme "omarchy" does

# Palette entries over the theme's, by name or hex. For example:
# accent: "orange" or "#e07a3f"; attention, Banda's signal colour, too.
# [colors]

# The colour tokens over the derived ones, by their names without "--"
# (the list: platform/theme/src/tokens.rs): a palette name, another
# token's name, or a colour as it is, never var() or color-mix().
# [tokens]

# The corners, in pixels, from the theme (ADR 0080, decision 6). A theme
# says two: the window's and a control's. A tile's is the window's less
# the outer gap, a card's the tile's less 8 but never below a control's,
# a chip's 0.6 of a control's; none below 0. The old `radius` still reads, as `roundness` of it over
# 7: `radius = 7` is the theme's own, `radius = 0` square.
# [shape]
# window = 30                        # the window, the desk
# control = 10                       # a button, an input, a select
# pill = false                       # true: controls and chips are pills
# roundness = 1                      # times every corner: 0 square, 1.2 rounder

# [gaps]
# inner = 8                          # between tiles, in pixels
# outer = 8                          # around the Strip

# The desk the tiles float over. Who makes its glass goes by the platform.
# On Linux Banda does, the same on every desktop: the wallpaper, blurred and
# tinted. Unset, the wallpaper is the desktop's (Omarchy, GNOME, KDE, XFCE,
# hyprpaper); without one, the desk is solid. On macOS and Windows the
# system does, with a material of its own, and the keys that shape Banda's
# glass do nothing.
# [desk]
# glass = true
# material = "banda"                 # the platform's; "system": the system blurs, from the next start
# wallpaper = "~/Pictures/wall.jpg"  # a picture of your own
# blur = 40                          # how frosted: the blur, in pixels
# saturation = 1.4                   # the wallpaper's colours: 1 as they are, 0 grey
# grain = 0.04                       # a fine grain over the glass: 0 none
# opacity = 0.4                      # the desk's tint: 0 clear, 1 solid; 0.1 over the system's
# sidebar = "panel"                  # "panel" floats as glass; "desk" sits on it
# sidebar-shadow = 0.45              # the panel's shadow: 0 none, 1 the darkest

# A tile's corner is the window's less the outer gap; `radius` says
# another: pixels, or a step of a control's ("sm" … "4xl").
# [tile]
# border = 1
# opacity = 1                        # over a glass desk; 1 is solid
# shadow = 0                         # over a glass desk: 0 none, 1 the darkest

# [focus]
# border = "accent"                  # the focused tile's border
# inactive-border = "border"         # every other tile's
# ring = 0                           # grows the focused frame into the gap
# shadow = 0.25                      # the focused tile's shadow: 0 none, 1 the darkest

# The elevations' strengths (ADR 0113): their shapes are Banda's.
# [shadow]
# float = 0.1                        # menus, dialogs, toasts, a floating bar, a thumb
# lift = 0.45                        # what you carry: a Pane being moved, a Peek

# A column's width is a share of the screen; Alt+R goes round the presets.
# [columns]
# presets = ["1/3", "1/2", "2/3", "1"]
# heights = ["1/3", "1/2", "2/3"]    # a Pane's in its column: Alt+Shift+R, Alt+Ctrl+Up and Down
# default = "1/2"                    # a new column's width
# alone = "1"                        # a column alone on its workspace; "1/2" never fills
# center = "never"                   # "never", "always" or "on-overflow"
# display = "stack"                  # "stack" or "deck": how a new column shows its Panes
# min = 30                           # no column narrower, in rem (a list: half)
# snap = 8                           # a size dragged with the mouse holds this near a preset or height, in pixels; 0 never

# [bar]
# height = 36
# left = ["workspaces.list", "window.flow"]  # widgets after the Mark, by id, in order; Alt and drag moves one
# center = ["sidebar.counts"]        # widgets in the middle; [] leaves it empty
# right = ["workspaces.aside", "terminal.ports", "harnesses.limits", "notifications.recent", "clock.now"]  # widgets on the right, before the connection

# A Thread that drops from the top over the workspace, on Alt+`.
# [drawer]
# height = 0.6                       # how far down, a share of the room under the bar
# harness = "claude"                 # the Harness it starts on; this computer's first when left out

# Every workspace zoomed out, one under another, on Alt+O.
# [overview]
# zoom = 0.35                        # how far out, at most: 0.5 is half their size

# Columns held together on a plate, on Alt+G.
# [groups]
# handle = false                     # true shows a handle on the top edge under the pointer, that carries them
# working = "breath"                 # at work: "breath" of the fill, "line" breathes, "sheen" of light across, or "still"
# asking = "twice"                   # a call: "twice", two swells then still, or "pulse" until answered
# saturation = "normal"              # every state's colour: "soft", "normal" or "vivid"

# [motion]
# off = false                        # true stills everything
# slowdown = 1                       # 2 is twice as slow
# Each move is a spring or an easing (duration-ms, curve), not both.
# [motion.workspace]
# spring = { damping-ratio = 1, stiffness = 800, epsilon = 0.0001 }
# [motion.strip]
# spring = { damping-ratio = 1, stiffness = 800, epsilon = 0.0001 }

# Banda's sounds when the work calls you.
# [sound]
# family = "banda"                   # "banda", "glass", "wood", "pop", "pluck" or "off"
# volume = 0.6                       # 0 to 1
# room = true                        # a little room around each sound
# done = true                        # true, false, or a family to borrow from
# asking = true
# failed = true
