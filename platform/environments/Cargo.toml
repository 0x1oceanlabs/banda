[package]
name = "banda-environments"
description = "Where a Project's programs run: the adapters of the kernel's environment port, local first (ADR 0084)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
banda-fence = { path = "../fence" }
banda-kernel = { path = "../../kernel" }
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# A hole in the fence, made whole.
dunce.workspace = true
# Whether this user is in the `docker` group, as the name service says.
nix.workspace = true

[target.'cfg(unix)'.dependencies]
# A terminal is a PTY on Unix; Windows' ConPTY comes later (ADR 0090, step 7).
pty-process.workspace = true
# Its size, and what runs in front on it.
rustix.workspace = true

[dev-dependencies]
dunce.workspace = true
tempfile.workspace = true

[lints]
workspace = true
