# Banda (ADR 0075, decision 4): zinc greys with a blue accent, light and
# dark, and Tailwind's colours for the terminal (ADR 0080, decision 3).
# A value is one for both, or { light, dark }; every key is optional.
#
# [colors] is the palette, by Omarchy's names; the rest of the tokens are
# worked out from it. [tokens] says only what differs from those: the
# accent marks the focus, the selection and links; the main buttons take
# the text's colour, as shadcn's do, so `[colors] accent = "…"` in
# look.toml recolours the focus and the rings, not the buttons.
#
# To make a theme of your own, copy this file to
# ~/.config/banda/themes/<name>/theme.toml, or start one with only
# `extends` and the colours you change.
name = "Banda"

[colors]
accent = { light = "#0b6fe0", dark = "#4ea3ff" }
selection = { light = "#cfe1fb", dark = "#1e3a5f" }
muted = { light = "#a1a1aa", dark = "#71717a" }
background = { light = "#ffffff", dark = "#19191c" }
dark_background = { light = "#fafafa", dark = "#202024" }
darker_background = { light = "#f4f4f5", dark = "#111113" }
lighter_background = { light = "#ffffff", dark = "#202024" }
foreground = { light = "#18181b", dark = "#ededef" }
dark_foreground = { light = "#71717a", dark = "#a1a1aa" }
light_foreground = { light = "#3f3f46", dark = "#d4d4d8" }
bright_foreground = { light = "#09090b", dark = "#ffffff" }
red = { light = "#dc2626", dark = "#f87171" }
yellow = { light = "#ca8a04", dark = "#facc15" }
orange = { light = "#ea580c", dark = "#fb923c" }
green = { light = "#16a34a", dark = "#4ade80" }
cyan = { light = "#0891b2", dark = "#22d3ee" }
blue = { light = "#0b6fe0", dark = "#4ea3ff" }
magenta = { light = "#c026d3", dark = "#e879f9" }
brown = { light = "#92400e", dark = "#b45309" }
bright_red = { light = "#ef4444", dark = "#fca5a5" }
bright_yellow = { light = "#eab308", dark = "#fde047" }
bright_green = { light = "#22c55e", dark = "#86efac" }
bright_cyan = { light = "#06b6d4", dark = "#67e8f9" }
bright_blue = { light = "#3b82f6", dark = "#93c5fd" }
bright_magenta = { light = "#d946ef", dark = "#f0abfc" }

[tokens]
desk-solid = "darker_background"
primary = "foreground"
primary-foreground = { light = "#fafafa" }
secondary = { light = "#f4f4f5", dark = "#27272a" }
muted = { light = "#f4f4f5", dark = "#27272a" }
accent = { light = "#f4f4f5", dark = "#27272a" }
destructive = { light = "oklch(0.577 0.245 27.325)", dark = "oklch(0.704 0.191 22.216)" }
attention = { light = "#e5590a", dark = "#ff8a3d" }
added = { light = "oklch(0.527 0.137 150.069)", dark = "oklch(0.723 0.192 149.579)" }
removed = { light = "oklch(0.577 0.245 27.325)", dark = "oklch(0.704 0.191 22.216)" }
border = { light = "oklch(0 0 0 / 8%)", dark = "oklch(1 0 0 / 8%)" }
input = { light = "oklch(0 0 0 / 12%)", dark = "oklch(1 0 0 / 12%)" }
sidebar-accent = { light = "#f0f0f2", dark = "#2a2a2e" }
sidebar-border = "border"
card = { dark = "#1f1f23" }
