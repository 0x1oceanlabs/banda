# Banda Light: zinc greys with a blue accent (ADR 0075, decision 4), and
# Tailwind's colours for the terminal. An Omarchy palette, so it works in
# Omarchy too: copy this folder to ~/.config/banda/themes/<name>/ and
# change what you like.
mode = "light"

accent = "#0b6fe0"
selection = "#cfe1fb"
muted = "#a1a1aa"

background = "#ffffff"
dark_background = "#fafafa"
darker_background = "#f4f4f5"
lighter_background = "#ffffff"

foreground = "#18181b"
dark_foreground = "#71717a"
light_foreground = "#3f3f46"
bright_foreground = "#09090b"

red = "#dc2626"
yellow = "#ca8a04"
orange = "#ea580c"
green = "#16a34a"
cyan = "#0891b2"
blue = "#0b6fe0"
magenta = "#c026d3"
brown = "#92400e"

bright_red = "#ef4444"
bright_yellow = "#eab308"
bright_green = "#22c55e"
bright_cyan = "#06b6d4"
bright_blue = "#3b82f6"
bright_magenta = "#d946ef"
