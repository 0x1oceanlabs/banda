[package]
name = "banda-settings"
description = "Banda's settings files, each described once (ADR 0016): the files there are, each one's JSON Schema from its Rust structs, a check of any of them, and the one writer that changes them. `banda settings` prints, checks and sets them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The agents' modes and agents.toml's shape, until they go behind what the
# settings ask of any App (#1798, step 2).
banda-agents = { path = "../../apps/agents/engine" }
banda-harnesses = { path = "../../platform/harnesses/engine" }
# A file written whole is put in place as the host does it (ADR 0090).
banda-kernel = { path = "../../kernel" }
banda-look = { path = "../../platform/look" }
banda-workspaces = { path = "../../platform/workspaces/engine" }
dunce.workspace = true
schemars.workspace = true
serde_json.workspace = true
toml_edit.workspace = true

[dev-dependencies]
# The parts' files, for the tests' whole list alone (tests/whole): the
# code that ships takes no App's crate but the agents', and the engine
# hands it each part's files.
banda-browser = { path = "../../apps/browser/engine" }
banda-files = { path = "../../apps/files/engine" }
banda-machines = { path = "../../platform/machines/engine" }
banda-sharing = { path = "../../platform/sharing/engine" }
banda-terminal = { path = "../../apps/terminal/engine" }
keyring-core.workspace = true
tempfile.workspace = true
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
