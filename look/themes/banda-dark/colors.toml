# Banda Dark: zinc greys with a blue accent (ADR 0075, decision 4), and
# Tailwind's colours for the terminal. An Omarchy palette, so it works in
# Omarchy too: copy this folder to ~/.config/banda/themes/<name>/ and
# change what you like.
mode = "dark"

accent = "#4ea3ff"
selection = "#1e3a5f"
muted = "#71717a"

background = "#19191c"
dark_background = "#202024"
darker_background = "#111113"
lighter_background = "#202024"

foreground = "#ededef"
dark_foreground = "#a1a1aa"
light_foreground = "#d4d4d8"
bright_foreground = "#ffffff"

red = "#f87171"
yellow = "#facc15"
orange = "#fb923c"
green = "#4ade80"
cyan = "#22d3ee"
blue = "#4ea3ff"
magenta = "#e879f9"
brown = "#b45309"

bright_red = "#fca5a5"
bright_yellow = "#fde047"
bright_green = "#86efac"
bright_cyan = "#67e8f9"
bright_blue = "#93c5fd"
bright_magenta = "#f0abfc"
