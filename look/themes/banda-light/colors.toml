# Banda Light: shadcn/ui's neutral greys, with Tailwind's colours for the
# terminal. An Omarchy palette, so it works in Omarchy too: copy this
# folder to ~/.config/banda/themes/<name>/ and change what you like.
mode = "light"

accent = "#171717"
selection = "#d4d4d4"
muted = "#a3a3a3"

background = "#ffffff"
dark_background = "#fafafa"
darker_background = "#f5f5f5"
lighter_background = "#ffffff"

foreground = "#0a0a0a"
dark_foreground = "#737373"
light_foreground = "#404040"
bright_foreground = "#000000"

red = "#dc2626"
yellow = "#ca8a04"
orange = "#ea580c"
green = "#16a34a"
cyan = "#0891b2"
blue = "#2563eb"
magenta = "#c026d3"
brown = "#92400e"

bright_red = "#ef4444"
bright_yellow = "#eab308"
bright_green = "#22c55e"
bright_cyan = "#06b6d4"
bright_blue = "#3b82f6"
bright_magenta = "#d946ef"
