# Banda Light (ADR 0075, decision 4): only what differs from the tokens
# its palette gives. The accent marks the focus, the selection and links;
# the main buttons take the text's colour, as shadcn's do, so
# `[colors] accent = "…"` in look.toml recolours the focus and the rings,
# not the buttons.
[tokens]
desk-solid = "darker_background"
primary = "foreground"
primary-foreground = "#fafafa"
secondary = "#f4f4f5"
muted = "#f4f4f5"
accent = "#f4f4f5"
destructive = "oklch(0.577 0.245 27.325)"
attention = "#e5590a"
added = "oklch(0.527 0.137 150.069)"
removed = "oklch(0.577 0.245 27.325)"
border = "oklch(0 0 0 / 8%)"
input = "oklch(0 0 0 / 12%)"
sidebar-accent = "#f0f0f2"
sidebar-border = "border"
