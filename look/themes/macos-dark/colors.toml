# macOS Dark: the Mac's own colours (ADR 0075): its window, label and
# separator colours, and Apple's system colours for the terminal. The
# accent is the one set in System Settings, which the window gives the
# page; Apple's blue elsewhere. Copied as a theme of your own, name a hex
# accent instead, as Omarchy reads only hex.
mode = "dark"

accent = "var(--system-accent)"
selection = "#3f638b"
muted = "#636366"

background = "#1e1e1e"
dark_background = "#2b2b2d"
darker_background = "#161616"
lighter_background = "#2c2c2e"

foreground = "#dfdfdf"
dark_foreground = "#8d8d93"
light_foreground = "#c7c7cc"
bright_foreground = "#ffffff"

red = "#ff453a"
yellow = "#ffd60a"
orange = "#ff9f0a"
green = "#30d158"
cyan = "#64d2ff"
blue = "#0a84ff"
magenta = "#bf5af2"
brown = "#ac8e68"

bright_red = "#ff6961"
bright_yellow = "#ffd426"
bright_green = "#31de4b"
bright_cyan = "#70d7ff"
bright_blue = "#409cff"
bright_magenta = "#da8fff"
