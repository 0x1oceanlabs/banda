#:schema ./schemas/keys.schema.json
# Banda's keys, over the window's own (ADR 0005), as Hyprland's and niri's
# binds. Alt+K lists every action with its id and its keys. Check a change
# with: banda settings check
#
# A key is Alt, Ctrl, Super (⌘ on a Mac) and Shift, any of them, then a
# letter, a digit, F1 to F24, Left, Right, Up, Down, Return, Space, Tab,
# Escape, Backspace, Delete, Insert, Home, End, PageUp, PageDown or one of
# [ ] , . / ; ' - = ` \. An action keeps the window's own keys
# besides the ones bound here; "none" frees a key, so it goes to the Pane,
# as Alt+F to a shell. Ctrl+Alt+Shift+K is no file's: it brings the
# window's own keys back until this file changes.
#
# A scope's actions, as the composer's, work while the focus is in it,
# before the window's, and are bound in its own table, [binds.composer]:
# a key there may be held with no mod, as Return, but not one its field
# would type.

# The mod is held for every Banda key and the mouse's moves: Alt, or one
# or two of Alt, Ctrl and Super (⌘ on a Mac), as Ctrl+Alt where your
# desktop holds Alt. Banda's other keys hold Shift or one more with it,
# and every menu writes them as they are pressed.
# mod = "Ctrl+Alt"

[binds]
# "Alt+M" = "column.maximize"
# "Alt+F" = "none"

