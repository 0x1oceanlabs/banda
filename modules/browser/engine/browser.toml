#:schema ./schemas/browser.schema.json
# How Banda's browser looks and searches (ADR 0013). Every key is
# optional: what you leave out is Banda's default, written below. The
# browser's switch writes `tabs` for you. Check a change with:
# banda settings check

# Where the tabs are: "top", a row above the page, or "left", a rail of
# icons beside it that opens to titles on hover.
tabs = "top"

# Where words that are not an address go: an address with %s where the
# words go.
# search = "https://duckduckgo.com/?q=%s"

# The extensions whose buttons sit in the row, by their IDs; the rest are
# behind the Extensions button, whose menu pins them for you.
# pinned = []

# Whether Banda blocks ads and trackers in the browser, with EasyList,
# EasyPrivacy and uBlock Origin's lists.
# blocker = true

# Banda's browser tools for Agents. Screenshots include visible page
# content, with password and card fields masked.
# [agents]
# enabled = true
# screenshots = false

# The sites Agents may use without asking, "allow", or never, "deny", by
# site: github.com covers its subdomains. Your answers on a tab write
# them; localhost never asks.
# [agents.sites]
# "github.com" = "allow"
