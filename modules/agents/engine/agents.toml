#:schema ./schemas/agents.schema.json
# How Threads start and messages to an Agent are sent (ADR 0016). Every
# key is optional: what you leave out is Banda's default, written below.
# Check a change with: banda settings check

# What a new Thread on a Harness starts with, by the Harness's ID. The
# Agents section sets it from the composer's bar; what it leaves out, the
# Harness chooses.
# [start.claude]
# mode = "auto"
# model = "opus"

# Where an Agent's Thread opens: "space", on its Space's workspace, in a
# row with the Space's other Agents (ADR 0065), or "off", beside the Pane
# in front.
# workspaces = "space"

# What Enter does with a message written while the Agent works: "steer",
# into the turn, so the Agent reads it as it works, or "queue", so it
# waits until the turn ends. Ctrl+Enter (⌘+Enter on a Mac) does the other.
# enter = "steer"
