# The files module, as it declares itself (ADR 0022). What its code says,
# its methods and its Panes, its code declares; this holds the rest.
id = "files"
name = "Files"
about = "Any folder, as a Finder shows it: a tree with the places beside it and its path above, what git ignores greyed and what git sees changed marked, what is hidden shown or not; what a path is; a file's text; fuzzy paths under a folder, what was opened lately first; and what changed in the folders shown. An Agent reaches only its Project's folder. A file opens in its Pane, drawn by the previewer that claims it (code, markdown, a picture, a PDF, video and sound, a page run in a sandbox, a CSV as a table, JSON as a tree, a notebook's saved outputs, a font's specimen, what an archive or a workbook holds, and any other file's bytes as hex) at a line, and lines picked there take a comment for a Thread; Open with… picks another previewer for an extension. Code and markdown are edited in place and saved as one types, each save only over the text it was read at: when the disk moved meanwhile, as an Agent wrote the file, nothing is written, and the Person compares, takes the disk's text or keeps theirs. A markdown task's box ticks. Nothing in .git, nor Banda's settings, is written. Space shows a file in Quick Look, over the desk. The file each Agent works on pulses in the tree, which can follow it, and what the turn changed is marked."
version = "0.1.0"
from-banda = true
# The settings file it owns, in ~/.config/banda.
settings = ["files.toml"]
