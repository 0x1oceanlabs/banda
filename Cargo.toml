[workspace]
resolver = "3"
members = ["apps/agents/engine", "apps/browser/engine", "apps/files/engine", "apps/git/engine", "apps/pulls/engine", "apps/terminal/engine", "engine", "kernel", "platform/apps/engine", "platform/bytes/engine", "platform/devices/engine", "platform/environments", "platform/fence", "platform/git-cli", "platform/harnesses/engine", "platform/keys/engine", "platform/look", "platform/machines/engine", "platform/problems/engine", "platform/settings", "platform/sharing/engine", "platform/skill", "platform/theme", "platform/updates/engine", "platform/workspaces/engine", "tools/fake-agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# A sub-agent's session and its updates come only behind `unstable_subagents`
# (ADR 0103, decision 7).
agent-client-protocol = { version = "3.6.0", features = ["unstable_session_fork", "unstable_subagents"] }
async-trait = "0.1"
base64 = "0.23"
calamine = "0.38"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "6"
# A path made whole without Windows' `\\?\` prefix, which no folder shown,
# `engine.json` nor `cmd.exe` takes (ADR 0090, decision 3).
dunce = "1.0.5"
# Thumbnails are scaled with SIMD (ADR 0073, step F6).
fast_image_resize = { version = "6.1.0", features = ["image"] }
flate2 = "1.1.10"
futures = "0.3"
getrandom = "0.4.3"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
# Claude Code names a folder's Keychain item by its name in Unicode's
# composed form (ADR 0043); the URL parser brings it already.
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
# Files' thumbnails decode these kinds only, in Rust: no AVIF, whose
# decoder is C (dav1d), nor the formats no camera nor screen writes.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
ignore = "0.4.25"
infer = "0.19"
# A picture's EXIF, for Files' info (BSD-2-Clause).
kamadak-exif = "0.6.2"
# The machine's secrets: a gateway's key (ADR 0078, decision 1), in the
# system keyring of each platform.
keyring-core = "1.0.1"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
windows-native-keyring-store = "1.1.0"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
# Landlock's scopes for the fence around a Harness's programs (ADR 0083,
# decision 1), in pure Rust.
landlock = "0.4.7"
# What the fence's launcher asks of the C library: fork, exec and the
# signal mask, whose bookkeeping is the C library's (platform/fence).
libc = "0.2.191"
# The name freedesktop gives a thumbnail is the MD5 of its file's URI.
md-5 = "0.10.6"
mime_guess = "2.0.5"
# Who owns a file, by name, for Files' info, and who the engine runs as.
nix = { version = "0.31.3", default-features = false, features = ["user"] }
# A release candidate, for notify 9: notify 8 starts the Mac's FSEvents
# stream anew from "now" for each folder watched or let go, and loses what
# changed meanwhile in every other folder (#1166). Back to a release once
# there is one.
notify-debouncer-full = "=0.8.0-rc.3"
nucleo-matcher = "0.3.1"
# macOS's power assertion, which keeps a Mac from idle sleep while its
# Agents work, and the CFString that names it (ADR 0097): sysinfo builds
# both there already.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "pwr_mgt"] }
percent-encoding = "2.3"
# A freedesktop thumbnail is a PNG that says its file's URI and time.
png = "0.18.1"
# Each program the engine starts on Windows is born in a Job Object of its
# own, which none of it can leave (ADR 0090, decision 3).
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "creation-flags", "kill-on-drop"] }
pty-process = { version = "0.5.4", features = ["async"] }
schemars = "1.2.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
# The few requests the engine makes itself, from its host: Claude Code's
# limits and what sharing sends (ADR 0043, ADR 0039, ADR 0062 decision 3).
# rustls with the system's certificates, and the proxy the variables name,
# or on macOS the system's settings (kernel/src/https.rs).
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "system-proxy"] }
# Ed25519, for the host key and the devices' keys at the door (ADR 0124):
# the one rustls already brings.
ring = "0.17.14"
rustix = { version = "1.1.6", features = ["process", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# An archive is only listed, never unpacked, so neither carries codecs of
# its own (ADR 0073, decision 6); a 7z's header needs only LZMA, and
# calamine brings deflate for workbooks.
sevenz-rust2 = { version = "0.24.2", default-features = false }
sha2 = "0.10.9"
sys-locale = "0.3"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tar = "0.4.46"
tempfile = "3"
thiserror = "2"
toml = "1.1"
toml_edit = "0.25.17"
# The system's Trash: moved to, listed and put back where the system
# lets it (ADR 0073, decision 10). Its chrono reads when on Linux.
trash = "5.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-tungstenite = "0.29"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-json-impl"] }
uuid = { version = "1.29.0", features = ["v4", "v5", "v7", "serde"] }
# A file's volume and index on Windows, read from the open file, so a
# token of the bytes module serves only the file it was given for (ADR
# 0106, step 4a). walkdir brings it already.
winapi-util = "0.1.11"
# The flags a program starts with on Windows, as `process-wrap` takes them:
# its names only, no call (ADR 0090, decision 10).
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Threading"] }
# The user's and the system's PATH on Windows, read again before a program
# is looked for (ADR 0090, decision 3).
windows-registry = "0.6.1"
# The Secret Service on the session bus, where gh keeps the Person's GitHub
# token on Linux: read with no program run (ADR 0083, kernel/src/gh.rs).
# logind's locks and UPower on the system bus, which keep a machine awake
# while its Agents work (ADR 0097).
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
zip = { version = "9.4.1", default-features = false }

# A released engine's panic names Banda's files and lines by itself: its
# backtrace reads them from these tables, with no symbols file to upload
# (ADR 0039, decision 9). Only Banda's own crates have them: a Problem
# keeps only Banda's frames, and the rest would make the engine much
# bigger.
[profile.release]
debug = "line-tables-only"

# A debug build keeps only the line tables too, and the crates Banda uses
# none: a test binary was 250–500 MB of debug info, each Agent's checkout
# has a target/ of its own, and their builds side by side wrote gigabytes
# a minute to the disk. A panic's backtrace still names file and line; a
# debugger no longer sees local variables (set `debug = true` locally for
# that).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
