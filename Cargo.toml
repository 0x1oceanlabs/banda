[workspace]
resolver = "3"
members = ["engine", "kernel", "look", "settings", "modules/agents/engine", "modules/browser/engine", "modules/files/engine", "modules/git/engine", "modules/harnesses/engine", "modules/problems/engine", "modules/pulls/engine", "modules/sharing/engine", "modules/skill", "modules/terminal/engine", "modules/workspaces/engine", "tools/fake-agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
agent-client-protocol = { version = "3.6.0", features = ["unstable_session_fork"] }
async-trait = "0.1"
base64 = "0.22"
calamine = "0.38"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "6"
# Thumbnails are scaled with SIMD (ADR 0073, step F6).
fast_image_resize = { version = "6.1.0", features = ["image"] }
flate2 = "1.1.10"
futures = "0.3"
getrandom = "0.4.3"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
# Files' thumbnails decode these kinds only, in Rust: no AVIF, whose
# decoder is C (dav1d), nor the formats no camera nor screen writes.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
ignore = "0.4.25"
infer = "0.19"
# A picture's EXIF, for Files' info (BSD-2-Clause).
kamadak-exif = "0.6.2"
# The name freedesktop gives a thumbnail is the MD5 of its file's URI.
md-5 = "0.10.6"
mime_guess = "2.0.5"
# Who owns a file, by name, for Files' info.
nix = { version = "0.31.3", default-features = false, features = ["user"] }
notify-debouncer-full = "0.7"
nucleo-matcher = "0.3.1"
percent-encoding = "2.3"
# A freedesktop thumbnail is a PNG that says its file's URI and time.
png = "0.18.1"
pty-process = { version = "0.5.4", features = ["async"] }
schemars = "1.2.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["process", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# An archive is only listed, never unpacked, so neither carries codecs of
# its own (ADR 0073, decision 6); a 7z's header needs only LZMA, and
# calamine brings deflate for workbooks.
sevenz-rust2 = { version = "0.24.2", default-features = false }
sha2 = "0.10.9"
sys-locale = "0.3"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tar = "0.4.46"
tempfile = "3"
thiserror = "2"
toml = "1.1"
toml_edit = "0.25.17"
# The system's Trash: moved to, listed and put back where the system
# lets it (ADR 0073, decision 10). Its chrono reads when on Linux.
trash = "5.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-tungstenite = "0.29"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-json-impl"] }
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
zip = { version = "9.4.1", default-features = false }

# A released engine's panic names Banda's files and lines by itself: its
# backtrace reads them from these tables, with no symbols file to upload
# (ADR 0039, decision 9). Only Banda's own crates have them: a Problem
# keeps only Banda's frames, and the rest would make the engine much
# bigger.
[profile.release]
debug = "line-tables-only"

[profile.release.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
