[package]
name = "banda-settings"
description = "Banda's settings files, each described once (ADR 0016): the files there are, each one's JSON Schema from its Rust structs, a check of any of them, and the one writer that changes them. `banda settings` prints, checks and sets them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
banda-agents = { path = "../modules/agents/engine" }
banda-browser = { path = "../modules/browser/engine" }
banda-harnesses = { path = "../modules/harnesses/engine" }
banda-look = { path = "../look" }
schemars.workspace = true
serde_json.workspace = true
toml_edit.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
