# Banda for macOS (ADR 0033, step 6): packs the app on GitHub's Apple
# silicon runner and keeps it as the run's artifact, publishing nothing.
# Run by hand on any branch, as a Mac is needed to try it:
#
#   gh workflow run mac --ref <branch>
#   gh run download <run id>
#
# Not on every push: while the repository is private, a macOS minute
# costs ten. A PR that changes how Banda is packed packs it too. Step 6
# moves it beside the Linux pack in release.yml, once Stable is published
# for macOS.
name: mac

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mac.yml
      - scripts/package.sh
      - app/desktop/electron-builder.config.mjs
      - app/desktop/src/channel.ts
      - app/desktop/package.json

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pack:
    name: pack (macOS)
    # A fork's PR never spends this repository's macOS minutes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # The Node ci/Dockerfile pins, and package.json's pnpm.
      - id: node
        run: echo "version=$(sed -n 's/^ARG NODE_VERSION=//p' ci/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.version }}
          # It would cache pnpm's store before pnpm is installed.
          package-manager-cache: false
      - run: npm install --global --silent "$(jq -r .packageManager package.json)"
      - run: rustup toolchain install
      # One cache for every branch's run, PR's or by hand.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mac
      # Unset BANDA_VERSION: the workspace's version, marked local. Signed
      # ad hoc in a PR too, which electron-builder otherwise leaves unsigned:
      # Apple silicon runs nothing unsigned.
      - run: scripts/package.sh dev
        env:
          CSC_FOR_PULL_REQUEST: true
      - name: the app is signed
        run: codesign --verify --deep --strict --verbose=2 app/desktop/dist/mac-arm64/*.app
      - uses: actions/upload-artifact@v4
        with:
          name: banda-dev-mac-${{ github.run_number }}
          path: app/desktop/dist/*.zip
          retention-days: 7
