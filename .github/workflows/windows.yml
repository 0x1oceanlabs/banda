# The Rust tests on GitHub's Windows runner (ADR 0090, decision 9): on every
# push to main, on a PR that touches Windows code, and by hand:
#
#   gh workflow run windows --ref <branch>
#
# Not a merge gate: a red run on main is fixed as a red `ci` is, and Roma
# decides when it gates. `ci`'s `windows` part checks every PR's lints and
# builds its tests for Windows. A test that needs `sh`, the exec bit or
# another thing of Unix is `cfg(unix)`, with the reason beside it.
#
# Each run keeps the engine it built, banda.exe, to try on a Windows machine.
name: windows

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows.yml
      - platform/windows/**
      - "**/windows.rs"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # As on devbox (ci/Dockerfile): no test reads the debug info.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    name: tests (Windows)
    # Not a fork's PR, as `ci` checks none (ADR 0038, decision 4).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      # The dependencies main's last run built, a failed one's too: a PR's
      # run reads them and saves none, so no PR leaves anything for the
      # next run to build on.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # Every test binary runs, so a red run shows all that fails.
      - run: cargo test --workspace --no-fail-fast
      # Built for the engine's own tests: a debug build, unsigned.
      - name: banda.exe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: banda-windows-x64
          path: target/debug/banda.exe
          if-no-files-found: warn
          retention-days: 30
