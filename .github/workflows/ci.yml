# scripts/check.sh's parts side by side on the runners on devbox
# (ci/README.md). One required status, `ci`, sums them up: a PR that changes
# only docs passes it without running them.
#
# A PR from a fork never runs on devbox (ADR 0038, decision 4): its code
# could leave anything in the runners' volumes. It runs on GitHub's runners,
# which install what ci/Dockerfile has on devbox.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      github-hosted:
        description: Run on GitHub's runners, as a fork's PR does
        type: boolean
        default: false

# Nothing here publishes; a PR's code gets a read-only token.
permissions:
  contents: read

# A new push to a PR cancels the run of the one before; every merge to main
# is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: what changed
    # A PR whose branch is not in this repository is a fork's, even when the
    # fork is gone. The other jobs run where this one did.
    runs-on: >-
      ${{ (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name != github.repository ||
           inputs.github-hosted) && 'ubuntu-24.04' || 'devbox' }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      runs-on: ${{ runner.environment == 'github-hosted' && 'ubuntu-24.04' || 'devbox' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # A PR's checkout is its merge with main, whose first parent is main.
      - id: diff
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] && git diff --quiet HEAD^1 HEAD -- . ':!*.md' ':!docs/'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    # GitHub adds the parts, "check (rust ts)"; a skipped job is just "check".
    name: check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.changes.outputs.runs-on }}
    timeout-minutes: 45
    strategy:
      # Every part reports, so a red run shows all it broke.
      fail-fast: false
      matrix:
        # ts reads the checkpoints rust's tests write, so they share a job.
        parts: [rust ts, window]
    steps:
      - uses: actions/checkout@v5
      - name: target/ from the runner's volume
        if: runner.environment == 'self-hosted'
        run: ci/target.sh
      # GitHub's image has rustup and what Electron runs on, not ci/Dockerfile's
      # Node and pnpm.
      - name: ci/Dockerfile's Node version
        if: runner.environment == 'github-hosted'
        id: node
        run: echo "version=$(sed -n 's/^ARG NODE_VERSION=//p' ci/Dockerfile)" >> "$GITHUB_OUTPUT"
      - if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: pnpm, which switches itself to package.json's pin
        if: runner.environment == 'github-hosted'
        run: npm install --global pnpm@11
      - name: rust-toolchain.toml's toolchain
        run: rustup toolchain install
      - run: scripts/check.sh ${{ matrix.parts }}
      - name: The window's traces
        if: failure() && matrix.parts == 'window'
        uses: actions/upload-artifact@v4
        with:
          name: window-traces
          path: app/desktop/test-results/
          retention-days: 7

  ci:
    name: ci
    needs: [changes, check]
    if: always()
    # It runs nothing of the PR's, so it may stand on either.
    runs-on: ${{ needs.changes.outputs.runs-on || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Every part passed or had nothing to check
        run: |
          echo "changes=${{ needs.changes.result }} check=${{ needs.check.result }}"
          [[ "${{ needs.changes.result }}" == success ]]
          [[ "${{ needs.check.result }}" == success || "${{ needs.check.result }}" == skipped ]]
