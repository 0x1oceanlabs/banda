# scripts/check.sh's parts side by side on GitHub's own runners, free for
# a public repository (ci/README.md): Ubuntu for `rust ts` and the window's
# shards, Windows for its `windows` part, and Ubuntu again for the fence's
# tests and the same-path test, which turn user namespaces on for
# themselves, and Ubuntu for banda.so. One required status, `ci`, sums them
# up: a PR that changes only docs passes it without running them, and one
# that changes only the site runs the site's part alone.
#
# A PR from a fork is not checked at all (ADR 0038, decision 4): `ci` fails
# on it, so it cannot be merged as it is. Roma reads it and takes its
# commits to a branch here, where CI runs. Each job is a VM of its own that
# GitHub throws away, so nothing a run leaves reaches the next but the
# caches main's runs save.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing here publishes; a PR's code gets a read-only token.
permissions:
  contents: read

# A new push to a PR cancels the run of the one before; every merge to main
# is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: what changed
    # Not a fork's PR, even one whose fork is gone; `check` follows it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      rust: ${{ steps.diff.outputs.rust }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # A PR's checkout is its merge with main, whose first parent is main.
      # `code` is all but the docs and banda.so's own files (site/, its
      # vercel.json). `rust` is the Rust and what builds it, all `windows`
      # and `fence` check. `site` is what banda.so is built of, as
      # vercel.json's ignoreCommand lists it.
      - id: diff
        run: |
          changes() { [[ "$GITHUB_EVENT_NAME" != pull_request ]] || ! git diff --quiet HEAD^1 HEAD -- "$@"; }
          if changes . ':!*.md' ':!docs/' ':!site/' ':!vercel.json'; then code=true; else code=false; fi
          if changes site/ vercel.json client/ui/src/styles/theme.css sdk/contract/src/generated/look/tokens.css docs/design/kit/mark.js \
            pnpm-lock.yaml pnpm-workspace.yaml .github/workflows/ci.yml scripts/check.sh; then site=true; else site=false; fi
          if changes '*.rs' '*Cargo.toml' Cargo.lock rust-toolchain.toml .cargo/ \
            .github/workflows/ci.yml scripts/check.sh; then rust=true; else rust=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"

  check:
    # GitHub adds the parts, "check (rust ts)"; a skipped job is just "check".
    name: check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # Every part reports, so a red run shows all it broke.
      fail-fast: false
      matrix:
        # ts reads the checkpoints rust's tests write, so they share a job.
        # The window's tests start the app one at a time, some 40 minutes
        # of them: the specs with arc, a second engine, are slow, and
        # Playwright's shards count tests, so they have shards of their
        # own (scripts/check.sh's BANDA_E2E_SPECS). Each shard is some
        # 5 minutes.
        include:
          - parts: rust ts
          - { parts: window, specs: rest, shard: 1/6 }
          - { parts: window, specs: rest, shard: 2/6 }
          - { parts: window, specs: rest, shard: 3/6 }
          - { parts: window, specs: rest, shard: 4/6 }
          - { parts: window, specs: rest, shard: 5/6 }
          - { parts: window, specs: rest, shard: 6/6 }
          - { parts: window, specs: arc, shard: 1/3 }
          - { parts: window, specs: arc, shard: 2/3 }
          - { parts: window, specs: arc, shard: 3/3 }
    permissions:
      contents: read
    env:
      BANDA_E2E_SPECS: ${{ matrix.specs }}
      BANDA_E2E_SHARD: ${{ matrix.shard }}
      # What the contract is compared with: the PR's base, or main before
      # this push (scripts/contract.mjs).
      BANDA_CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      # As ci/Dockerfile had it: no check reads the debug info.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # `ts` compares the contract with main's and reads the branch's
          # Contract-Break trailers (scripts/contract.mjs). 0 is false in an
          # expression, so `rust ts` takes 0 last.
          fetch-depth: ${{ matrix.parts != 'rust ts' && 1 || 0 }}
      # The Node ci/Dockerfile pins, and package.json's pnpm.
      - id: node
        run: echo "version=$(sed -n 's/^ARG NODE_VERSION=//p' ci/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          # It would cache pnpm's store before pnpm is installed.
          package-manager-cache: false
      - run: npm install --global --silent "$(jq -r .packageManager package.json)"
      # pnpm's store and Electron's download, by the lockfile: a new lock
      # saves a new entry once, which every part then reads.
      - id: paths
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.paths.outputs.store }}
            ~/.cache/electron
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: rustup toolchain install
      # The dependencies main's last `rust ts` built, which every Linux part
      # reads: it builds the most of them, and only it saves, from main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.parts == 'rust ts' }}
          cache-on-failure: true
      # Electron's libraries and font are ci/Dockerfile's list.
      - name: What Electron's Chromium loads
        if: matrix.parts == 'window'
        run: |
          ci/apt.sh \
            libnss3 libatk-bridge2.0-0t64 libatk1.0-0t64 libcups2t64 libgbm1 libasound2t64 \
            libgtk-3-0t64 libxss1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libpango-1.0-0 libcairo2 libdrm2 libxkbcommon0 libx11-xcb1 libxshmfence1 \
            fonts-dejavu-core
      - run: scripts/check.sh ${{ matrix.parts }}
      - name: The window's traces
        if: failure() && matrix.parts == 'window'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: window-traces-${{ strategy.job-index }}
          path: client/desktop/test-results/
          retention-days: 7
      # How the Tiling moved, for a PR's numbers before and after (ADR 0088,
      # decision 13); the job's summary has them as tables.
      - name: The motion numbers
        if: always() && matrix.parts == 'window'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: motion-${{ strategy.job-index }}
          path: client/desktop/test-results/motion.*
          if-no-files-found: ignore
          retention-days: 30

  # The workspace for Windows, its lints and its tests' build (ADR 0090,
  # decision 9), on GitHub's own runner, free for a public repository, whose
  # Visual Studio has Microsoft's CRT and SDK. The tests run in
  # windows.yml.
  #
  # It gates merges once it has passed on main, which main's run leaves an
  # artifact to say. Until then a failure only warns and the part stays
  # green, so neither a PR nor main's Dev build (release.yml) is held up by
  # what main has not passed yet.
  windows:
    name: windows
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    # To ask whether the part has passed on main.
    permissions:
      contents: read
      actions: read
    env:
      # As `check`: no check reads the debug info.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      # The dependencies main's last run built, a failed one's too: a PR's
      # run reads them and saves none, so no PR leaves anything for the
      # next run to build on.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - id: check
        run: scripts/check.sh windows
        shell: bash
        continue-on-error: true
      # bash fails the step on a failed call to the API (-eo pipefail), so
      # a failure is never let through for want of an answer.
      - name: Failed, which gates once the part has passed on main
        if: steps.check.outcome != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=windows-passed-on-main&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not)] | length')
          if ((passed > 0)); then
            echo "::error::scripts/check.sh windows failed, and the part gates merges: it has passed on main."
            exit 1
          fi
          echo "::warning::scripts/check.sh windows failed. The part gates merges once it has passed on main."
      - name: Passed on main
        if: steps.check.outcome == 'success' && github.ref == 'refs/heads/main'
        run: echo "$GITHUB_SHA" > windows-passed
        shell: bash
      - if: steps.check.outcome == 'success' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: windows-passed-on-main
          path: windows-passed
          retention-days: 90

  # The fence's tests make user, mount and PID namespaces, which Ubuntu
  # keeps off behind AppArmor, so in `check` they skip, each saying why.
  # This job turns them on for itself, as its runner is a VM of its own. Here every test runs: one that would skip,
  # for want of namespaces, Landlock or bwrap, fails the part.
  fence:
    name: fence (Linux namespaces)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # As `check`: no test reads the debug info.
      CARGO_PROFILE_DEV_DEBUG: 0
      BANDA_FENCE_TESTS: all
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # `check`'s cache: main's `rust ts` saves it, a superset of these.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: false
          cache-on-failure: true
      - name: Unprivileged user namespaces, bwrap for the test of one inside the fence, and ssh with a drop-in of root's
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ci/apt.sh bubblewrap openssh-client
          sudo mkdir -p /etc/ssh/ssh_config.d
          echo "ServerAliveInterval 30" | sudo tee /etc/ssh/ssh_config.d/50-banda-fence-test.conf
      - run: cargo test -p banda-fence
      - run: cargo test -p banda --test fence

  # The same-path test (client/desktop/e2e/same-path.spec.ts, ADR 0106):
  # the fake machine "arc" runs in a mount namespace of its own, where the
  # path of this machine's Project holds arc's files, so a window that
  # reads this machine's file for arc's reads "mac" and fails. As `fence`,
  # it runs on GitHub's Ubuntu VM, where the job may turn unprivileged user
  # namespaces on for itself; `check`'s window shards, which leave them
  # off, run the same spec with arc's files only in arc's own folders. BANDA_SAME_PATH=require fails
  # the job where bwrap makes no namespace, rather than let it pass on
  # arc's folders alone. More of the window's tests move here slice by
  # slice: each road's spec, `remote-*.spec.ts`, joins the list as its
  # step turns it on (ci/README.md).
  same-path:
    name: same path (two machines, one path)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each test starts arc, some 15 seconds: two runners halve it.
        shard: [1/2, 2/2]
    permissions:
      contents: read
    env:
      # As `check`: no check reads the debug info.
      CARGO_PROFILE_DEV_DEBUG: 0
      BANDA_SAME_PATH: require
      BANDA_E2E_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The Node ci/Dockerfile pins, and package.json's pnpm, as `check`
      # has them.
      - id: node
        run: echo "version=$(sed -n 's/^ARG NODE_VERSION=//p' ci/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          # It would cache pnpm's store before pnpm is installed.
          package-manager-cache: false
      - run: npm install --global --silent "$(jq -r .packageManager package.json)"
      - run: rustup toolchain install
      # `check`'s cache: main's `rust ts` saves it, a superset of these.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: false
          cache-on-failure: true
      # Electron's libraries and font are ci/Dockerfile's list.
      - name: Unprivileged user namespaces, bwrap for arc's, and what Electron's Chromium loads
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ci/apt.sh bubblewrap \
            libnss3 libatk-bridge2.0-0t64 libatk1.0-0t64 libcups2t64 libgbm1 libasound2t64 \
            libgtk-3-0t64 libxss1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libpango-1.0-0 libcairo2 libdrm2 libxkbcommon0 libx11-xcb1 libxshmfence1 \
            fonts-dejavu-core
      # Only the two programs the specs start: the engine and the fake agent.
      - run: cargo build --quiet -p banda -p banda-fake-agent
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @banda/desktop exec install-electron
      - run: pnpm --filter @banda/desktop build
      - run: pnpm --filter @banda/desktop exec playwright test --shard="$BANDA_E2E_SHARD" same-path.spec.ts remote-bytes.spec.ts remote-panes.spec.ts remote-git.spec.ts remote-terminal.spec.ts remote-run.spec.ts remote-files.spec.ts
      - name: The window's traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: same-path-traces-${{ strategy.job-index }}
          path: client/desktop/test-results/
          retention-days: 7

  # banda.so (ADR 0128): its format, lints, types and build, with no Rust
  # and no Electron. A PR that changes only the site runs it alone.
  site:
    name: site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The Node ci/Dockerfile pins, and package.json's pnpm, as `check`
      # has them.
      - id: node
        run: echo "version=$(sed -n 's/^ARG NODE_VERSION=//p' ci/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          # It would cache pnpm's store before pnpm is installed.
          package-manager-cache: false
      - run: npm install --global --silent "$(jq -r .packageManager package.json)"
      - id: paths
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # `check`'s pnpm store, which main's runs save; it only reads it.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.paths.outputs.store }}
            ~/.cache/electron
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: scripts/check.sh site

  ci:
    name: ci
    needs: [changes, check, windows, fence, same-path, site]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: A fork's PR is not checked here
        if: needs.changes.result == 'skipped'
        run: |
          echo "::error::A fork's PR is not checked here (ADR 0038, decision 4): Roma takes its commits to a branch of this repository."
          exit 1
      - name: Every part passed or had nothing to check
        run: |
          echo "changes=${{ needs.changes.result }} check=${{ needs.check.result }} windows=${{ needs.windows.result }} fence=${{ needs.fence.result }} same-path=${{ needs.same-path.result }} site=${{ needs.site.result }}"
          [[ "${{ needs.changes.result }}" == success ]]
          [[ "${{ needs.check.result }}" == success || "${{ needs.check.result }}" == skipped ]]
          [[ "${{ needs.windows.result }}" == success || "${{ needs.windows.result }}" == skipped ]]
          [[ "${{ needs.fence.result }}" == success || "${{ needs.fence.result }}" == skipped ]]
          [[ "${{ needs.same-path.result }}" == success || "${{ needs.same-path.result }}" == skipped ]]
          [[ "${{ needs.site.result }}" == success || "${{ needs.site.result }}" == skipped ]]
