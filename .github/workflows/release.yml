# Banda's releases (ADR 0033, step 3): Banda Dev on every push to main once
# `ci` is green on it. Each packs the AppImage with scripts/package.sh on
# GitHub's Ubuntu runner, as `ci` runs (ci/README.md), and publishes it with
# scripts/release.mjs, beside dev-linux.yml
# (dev-mac.yml for the Mac), the update file Banda Dev reads (ADR 0041; its
# name, ADR 0092 decision 12). The Mac's zip is packed on GitHub's Apple
# silicon runner at the same time and added to the release once it is out
# (decision 6), so Linux never waits for the Mac.
#
# No Stable is built here, and a tag pushed by hand ships nothing (ADR 0092,
# step 2): nothing here starts on a tag, and a run by hand publishes
# nothing.
# Banda will be promoted from a Dev once a day (its step 6).
#
# A PR that changes how Banda is packed packs both, publishing nothing, as
# a run by hand does on any branch, to try a Mac build:
#
#   gh workflow run release --ref <branch>
#   gh run download <run id>
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.sh
      - scripts/release.mjs
      - scripts/engine.mjs
      - scripts/install.sh
      - client/desktop/electron-builder.config.mjs
      - client/desktop/src/channel.ts
      - client/desktop/package.json
  workflow_dispatch:

permissions:
  contents: read

# One Dev at a time; a newer push waits, and one waiting is replaced by the
# next, so the last of a burst of merges is the one built. A run that builds
# nothing (its `ci` failed or was cancelled) is in a group of its own, so it
# replaces no Dev. A PR's or a run by hand is in its ref's group, so
# neither replaces a Dev waiting either.
concurrency:
  group: >-
    release-${{
      github.event_name != 'workflow_run' && github.ref ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') && 'dev' ||
      github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  which:
    name: which Banda
    # A Dev only from a push to main whose `ci` passed, and a PR packed only
    # from a branch of this repository: a fork's code never runs with this
    # repository's token (ADR 0038, decision 4).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.which.outputs.channel }}
      version: ${{ steps.which.outputs.version }}
      commit: ${{ steps.which.outputs.commit }}
      publish: ${{ steps.which.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: which
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "channel=dev" >> "$GITHUB_OUTPUT"
          # A PR's or a run by hand is the workspace's version, marked
          # local (scripts/package.sh), and publishes nothing.
          if [[ $EVENT != workflow_run ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Dev is the workspace's version, as no Stable has shipped (ADR
          # 0033, decision 2). No tag is read, so one pushed by hand
          # changes no Dev's number either (ADR 0092, step 2).
          workspace=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$workspace-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  linux:
    name: pack
    needs: which
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # To publish. A PR's run gets it too, packing its own branch but
    # publishing nothing.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.which.outputs.commit }}
          # release.mjs reads what the commit changed, against its parent.
          fetch-depth: 0
      # The Node ci/Dockerfile pins, and package.json's pnpm, as `ci`.
      - id: node
        run: echo "version=$(sed -n 's/^ARG NODE_VERSION=//p' ci/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.version }}
          package-manager-cache: false
      - run: npm install --global --silent "$(jq -r .packageManager package.json)"
      # pnpm's store and Electron's download, as `ci` keeps them; a pack
      # reads them and saves none.
      - id: paths
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.paths.outputs.store }}
            ~/.cache/electron
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: rustup toolchain install
      # The release build's dependencies, which only a Dev's own run saves:
      # a PR's pack builds on them and leaves nothing for a Dev.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
          save-if: ${{ needs.which.outputs.publish == 'true' }}
      - name: pack
        env:
          BANDA_VERSION: ${{ needs.which.outputs.version }}
        run: scripts/package.sh ${{ needs.which.outputs.channel }}
      # Each app's update file has its own name (ADR 0092, decision 12): a
      # release without it updates no one, so a PR's run fails here too.
      - name: the update file is there
        env:
          CHANNEL: ${{ needs.which.outputs.channel }}
        run: |
          feed=$([[ $CHANNEL == dev ]] && echo dev || echo latest)
          ls client/desktop/dist/$feed-linux.yml client/desktop/dist/$feed-engine-linux.yml \
            client/desktop/dist/*-engine-linux-*.tar.gz
      # A Dev runs main's copy of this file on the commit whose `ci` passed,
      # which may be older than it (v0.1.0-dev.689 had no install.sh yet):
      # a file this copy names that the commit has not is left out, never
      # failed on.
      - name: publish
        if: needs.which.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          files=(client/desktop/dist/*.AppImage client/desktop/dist/*-engine-linux-*.tar.gz
            client/desktop/dist/*-linux.yml)
          [[ -f scripts/install.sh ]] && files+=(scripts/install.sh)
          node scripts/release.mjs "${{ needs.which.outputs.channel }}" \
            "${{ needs.which.outputs.version }}" "${{ needs.which.outputs.commit }}" "${files[@]}"
      - name: keep what was packed
        if: needs.which.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: banda-linux-${{ github.run_number }}
          path: |
            client/desktop/dist/*.AppImage
            client/desktop/dist/*-engine-linux-*.tar.gz
            client/desktop/dist/*-linux.yml
          retention-days: 3

  mac:
    name: pack (macOS)
    needs: which
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.which.outputs.commit }}
      # The Node ci/Dockerfile pins, and package.json's pnpm.
      - id: node
        run: echo "version=$(sed -n 's/^ARG NODE_VERSION=//p' ci/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.version }}
          # It would cache pnpm's store before pnpm is installed.
          package-manager-cache: false
      - run: npm install --global --silent "$(jq -r .packageManager package.json)"
      - run: rustup toolchain install
      # One cache for every run, a release's, a PR's or by hand.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mac
      # Signed ad hoc in a PR too, which electron-builder otherwise leaves
      # unsigned: Apple silicon runs nothing unsigned.
      - name: pack
        run: scripts/package.sh ${{ needs.which.outputs.channel }}
        env:
          BANDA_VERSION: ${{ needs.which.outputs.version }}
          CSC_FOR_PULL_REQUEST: true
      - name: the app is signed
        run: codesign --verify --deep --strict --verbose=2 client/desktop/dist/mac-arm64/*.app
      - name: the update file is there
        env:
          CHANNEL: ${{ needs.which.outputs.channel }}
        run: |
          feed=$([[ $CHANNEL == dev ]] && echo dev || echo latest)
          ls client/desktop/dist/$feed-mac.yml client/desktop/dist/$feed-engine-mac.yml \
            client/desktop/dist/*-engine-mac-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: banda-mac-${{ github.run_number }}
          path: |
            client/desktop/dist/*.zip
            client/desktop/dist/*-engine-mac-*.tar.gz
            client/desktop/dist/*-mac.yml
          retention-days: 3

  # Only for a release, never a PR's code: it holds the tap's key.
  mac-publish:
    name: publish (macOS)
    needs: [which, linux, mac]
    if: needs.which.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.which.outputs.commit }}
      - id: node
        run: echo "version=$(sed -n 's/^ARG NODE_VERSION=//p' ci/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.version }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: banda-mac-${{ github.run_number }}
          path: ${{ runner.temp }}/mac
      - id: add
        name: add the Mac's zip to the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAC: ${{ runner.temp }}/mac
        run: node scripts/release.mjs add ${{ needs.which.outputs.version }} "$MAC"/*.zip "$MAC"/*-engine-mac-*.tar.gz "$MAC"/*-mac.yml
      # Pushed with the tap's deploy key, in the secret TAP_KEY: `brew
      # upgrade` finds the release (ADR 0033, decision 6).
      - name: the cask in the tap
        if: steps.add.outputs.added == 'true'
        env:
          TAP_KEY: ${{ secrets.TAP_KEY }}
          CHANNEL: ${{ needs.which.outputs.channel }}
          VERSION: ${{ needs.which.outputs.version }}
          MAC: ${{ runner.temp }}/mac
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          key=$RUNNER_TEMP/tap-key
          tap=$RUNNER_TEMP/tap
          printf '%s\n' "$TAP_KEY" > "$key" && chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --depth 1 git@github.com:0x1oceanlabs/homebrew-banda.git "$tap"
          name=$([[ $CHANNEL == dev ]] && echo banda-dev || echo banda)
          mkdir -p "$tap/Casks"
          node scripts/cask.mjs "$CHANNEL" "$VERSION" "$MAC"/*.zip > "$tap/Casks/$name.rb"
          cd "$tap"
          git add Casks
          git diff --cached --quiet && exit 0
          git commit -q -m "$name $VERSION"
          # Another push to the tap in between: this one goes on top.
          git push -q || { git pull -q --rebase && git push -q; }
