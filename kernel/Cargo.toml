[package]
name = "banda-kernel"
description = "The kernel: Projects, the event log, receipts, the outbox, the access decision, the module registry and the API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
dirs.workspace = true
dunce.workspace = true
notify-debouncer-full.workspace = true
reqwest.workspace = true
axum.workspace = true
futures.workspace = true
getrandom.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
rustix = { workspace = true, features = ["fs"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ts-rs.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[target.'cfg(windows)'.dependencies]
process-wrap.workspace = true
windows.workspace = true
windows-registry.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite.workspace = true

# A keyring on a socket of a test's own (kernel/src/gh.rs).
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { workspace = true, features = ["p2p"] }

[lints]
workspace = true
