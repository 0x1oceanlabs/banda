# The window's own part, as a module declares itself (ADR 0022, ADR 0071):
# its actions its code declares; client/web's tests copy them into
# window.json beside this file. The Tiling's are the workspaces' own, in
# platform/workspaces/window.json (ADR 0087, decision 13).
# It has no kind, api or [needs], which an App or a platform part declares:
# the Window is neither, but a client's program (ADR 0087, decision 1).
id = "window"
name = "Window"
about = "The window's own actions: the tiling of columns, Panes and workspaces, the sidebar, the Banda menu and the settings."
version = "0.1.0"
from-banda = true
