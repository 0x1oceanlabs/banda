[package]
name = "banda-browser"
description = "The browser module's engine part: Banda's browser tools for Agents, which the window does for its tabs (ADR 0029) and the machine's Chromium for its own (ADR 0132)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
banda-kernel = { path = "../../../kernel" }
banda-tiling = { path = "../../../platform/tiling" }
banda-look = { path = "../../../platform/look" }
dirs.workspace = true
dunce.workspace = true
psl.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ts-rs.workspace = true
url.workspace = true
# Chrome for Testing's zips are deflated (ADR 0132, decision 2).
zip = { workspace = true, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile.workspace = true
# A test's clock runs on by itself past a driver that never answers.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
