# The browser module, as it declares itself (ADR 0022). Its Pane, actions
# and sources its code declares; its part in the window's main process is
# `desktop` (ADR 0028), and its engine part, `engine`, holds no pages: its
# tools for Agents ask the window (ADR 0029).
id = "browser"
kind = "app"
name = "Browser"
about = "Chromium pages in the window: the Person's tabs, and each Project's Agents' in a profile of their own; extensions, and a blocker of ads and trackers."
version = "0.1.0"
# The major of the App API it is written to (ADR 0062, ADR 0082).
api = 1
from-banda = true
# The settings files it owns, in ~/.config/banda.
settings = ["browser.toml"]

# What it needs of Banda (ADR 0082, decision 2): nothing it could
# declare here is built yet.
[needs]

# Paths it takes that a module from elsewhere would lack (ADR 0022,
# decision 6), each with why. One that gets its place in the contract goes.
[unstable]
desktop-preload = "the preload calls the extensions' buttons on electron-chrome-extensions' own channels, and presses the keys taken from a page, by hand (client/desktop/src/preload.ts; ADR 0028)"
