[package]
name = "banda-terminal"
description = "The terminal module: programs a Person runs in a terminal, in the engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
banda-kernel = { path = "../../../kernel" }
banda-look = { path = "../../../platform/look" }
dirs.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ts-rs.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo.workspace = true

[target.'cfg(unix)'.dependencies]
# A server found running stops by signals to it (ADR 0044); Windows'
# servers come later (ADR 0090, step 8).
rustix.workspace = true

[dev-dependencies]
banda-environments = { path = "../../../platform/environments" }
tempfile.workspace = true

[lints]
workspace = true
