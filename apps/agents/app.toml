# The agents module, as it declares itself (ADR 0022). What its code says,
# its methods and its Panes, its code declares; this holds the rest. Its
# part in the window's main process, `desktop` (ADR 0028), serves the
# Visuals its Agents show (ADR 0037).
id = "agents"
kind = "app"
name = "Agents"
about = "Tasks with Agents on their Harnesses: what each says and does, and what it asks the Person; and a short run of a Task's Harness apart from it, as for a commit's message."
version = "0.1.0"
# The major of the App API it is written to (ADR 0062, ADR 0082).
api = 1
from-banda = true
# The settings files it owns, in ~/.config/banda.
settings = ["agents.toml"]

# What it needs of Banda (ADR 0082, decision 2): the facts of other parts
# it hears, each listener by its name. The rest it could declare here is
# not built yet.
[needs]

# A step git's card asked for was done: a notice for the Task's Agent.
[needs.listens.card-steps]
from = "git"
kinds = ["git.acted"]

# A tab the Person lent a Task, or the end of its lend: a notice too.
[needs.listens.lent-tabs]
from = "browser"
kinds = ["browser.lent"]

# An account of this machine's changed or was removed, heard by two
# listeners: its Tasks' Harness processes are let go, and those of a
# removed one retire.
[needs.listens.removed-accounts]
from = "harnesses"
kinds = ["account_changed"]

[needs.listens.accounts]
from = "harnesses"
kinds = ["account_changed"]
