#:schema ./schemas/agents.schema.json
# How Threads start and messages to an Agent are sent (ADR 0016). Every
# key is optional: what you leave out is Banda's default, written below.
# Check a change with: banda settings check

# [start]
# The account a new Thread starts on, by its entry's ID in harnesses.toml,
# and the one it starts on while that one is out of its limits, of any
# Harness (ADR 0093). By default the first one on, and no fallback.
# account = "claude"
# fallback = "personal"

# What a new Thread on a Harness starts with, by the Harness's ID. The
# Agents section sets it from the composer's bar; what it leaves out, the
# Harness chooses.
# [start.claude]
# mode = "auto"
# model = "opus"

# [models]
# The models in each Harness's menu, by the Harness's ID (ADR 0114). The
# stars in the model picker's "All models" set them. By default a menu
# holds the first three models the Harness offers.
# claude = ["default", "opus", "sonnet"]

# How an Agent's windows stand, its Flow (ADR 0079): "free", where they
# are, a Thread opening beside the Pane in front; "row", each Project on
# its own workspace, its Agents in a row (ADR 0065, ADR 0102); or "solo",
# as the row, what has the focus filling the screen. The Flow's icon on
# the bar switches it, and Alt+Shift+M goes from row to solo.
# flow = "row"

# How many seconds the focus stays on a Thread it only came to, by
# scrolling the Strip or Alt+arrow, before its Done counts as seen (ADR
# 0096). A click or a key in the Thread counts at once; 0 counts the focus
# at once too.
# seen-after = 2.5

# What Enter does with a message written while the Agent works: "steer",
# into the turn, so the Agent reads it as it works, or "queue", so it
# waits until the turn ends. Ctrl+Enter (⌘+Enter on a Mac) does the other.
# enter = "steer"
