# The files module, as it declares itself (ADR 0022). What its code says,
# its methods and its Panes, its code declares; this holds the rest.
id = "files"
kind = "app"
name = "Files"
about = "Any folder, as a Finder shows it: a tree with the places beside it and its path above, what git ignores greyed and what git sees changed marked, what is hidden shown or not; what a path is; a file's text; fuzzy paths under a folder, what was opened lately first; and what changed in the folders shown. An Agent reaches only its Project's folder. A file opens in its Pane, drawn by the previewer that claims it (code, markdown, a picture, a PDF, video and sound, a page run in a sandbox, a CSV as a table, JSON as a tree, a notebook's saved outputs, a font's specimen, what an archive or a workbook holds, and any other file's bytes as hex) at a line, and lines picked there take a comment for a Thread; Open with… picks another previewer for an extension. Code and markdown are edited in place and saved as one types, each save only over the text it was read at: when the disk moved meanwhile, as an Agent wrote the file, nothing is written, and the Person compares, takes the disk's text or keeps theirs. A markdown task's box ticks. It makes, renames, duplicates, copies and moves files and folders, never over another unless asked (a name taken asks Replace, Keep both or Skip), and sends them to the system's Trash, which it lists, puts back from and empties where the system lets it (not on macOS, whose Finder keeps it); each is undone by Ctrl+Z or its toast's Undo. Several names are renamed as text, after a diff. Nothing in .git, nor Banda's settings, is written. It finds words or a pattern in the files under a folder, and Alt+P opens one of the Project's files. Space shows a file in Quick Look, over the desk. A folder shows as a tree, as Miller columns whose last one previews the file picked, or as a gallery, a big preview over a filmstrip of small pictures (Ctrl+1, 2, 3); a picture's small one comes from the desktop's thumbnails or is made and kept. Ctrl+I shows what the row picked is at length: its size (a folder's counted as asked), times, permissions and owner, where a link leads, a picture's size and EXIF, and the last commit that changed it. The file each Agent works on pulses in the tree, which can follow it, and what the turn changed is marked."
version = "0.1.0"
# The major of the App API it is written to (ADR 0062, ADR 0082).
api = 1
from-banda = true
# The settings file it owns, in ~/.config/banda.
settings = ["files.toml"]

# What it needs of Banda (ADR 0082, decision 2): nothing it could
# declare here is built yet.
[needs]
