#:schema ./schemas/files.schema.json
# What Files shows (ADR 0073). Every key is optional: what you leave out
# is Banda's default, written below. Check a change with:
# banda settings check

# The folders pinned among Files' places, in their order: whole, or from
# ~. A folder's menu in Files pins and unpins.
# pinned = ["~/Pictures/Screenshots"]

# Whether a Files Pane shows hidden files, whose names start with a dot.
# Each Pane can show them or not for itself.
# hidden = false

# Whether a Files Pane shows what git ignores, greyed. Off hides it.
# ignored = true

# Whether a row of the tree shows a picture's small picture in place of
# its icon. The Gallery shows them always.
# thumbnails = false

# The editor a file opens in, by its id: Files' "Open in", and a path in a
# reply clicked with Ctrl or ⌘. Empty is the first found of cursor,
# vscode, vscode-insiders, vscodium, windsurf, zed, sublime, and the
# JetBrains IDEs (idea, webstorm, pycharm, goland, rustrover, clion,
# phpstorm, rubymine, rider).
# editor = ""

# The previewer a file of an extension shows in, by its id: what "Open
# with…" in a file's Pane picks. One that does not draw the file is
# passed over.
# [previewers]
# md = "files.code"
