# The pulls module, as it declares itself (ADR 0022). What its code says,
# its methods, its code declares; this holds the rest.
id = "pulls"
kind = "app"
name = "Pull requests"
about = "The GitHub pull requests linked to a Project's Tasks (ADR 0076): Create PR's, an Agent's own `gh pr create`, its tools' and the Person's. It reads them through `gh`, one reader for the Project while something follows it, and works out what each needs and whose turn it is."
version = "0.1.0"
# The major of the App API it is written to (ADR 0062, ADR 0082).
api = 1
from-banda = true
settings = []

# What it needs of Banda (ADR 0082, decision 2): the facts of other parts
# it hears, each listener by its name. The rest it could declare here is
# not built yet.
[needs]

# An Agent's shell calls, for the pull requests it made itself.
[needs.listens.links]
from = "agents"
kinds = ["tool.started", "tool.changed", "tool.output", "turn.started", "turn.ended"]

# A commit, a push or a pull from a Task's card.
[needs.listens.pushes]
from = "git"
kinds = ["git.acted"]
